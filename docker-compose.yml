version: "3.8"

# This is a project-level docker-compose for the personal lifestyle
# management agent built on top of Hermes Agent.

services:
  # Hermes Agent runtime (runs the CLI / gateway / agent core)
  hermes:
    image: ghcr.io/nousresearch/hermes-agent:latest
    container_name: fp-agent-hermes
    environment:
      - HERMES_HOME=/data/hermes
      - LLM_PROVIDER=${HERMES_LLM_PROVIDER}
      - LLM_MODEL=${HERMES_MODEL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NOUS_API_KEY=${NOUS_API_KEY}
      - AUTO_REMINDER=${AUTO_REMINDER}
      - REMINDER_TIME_MORNING=${REMINDER_TIME_MORNING}
      - REMINDER_TIME_EVENING=${REMINDER_TIME_EVENING}
    volumes:
      - ./:/workspace:ro
      - hermes_data:/data
    working_dir: /workspace
    command: "hermes chat --non-interactive --prompt 'Hello'"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  hermes_data:
